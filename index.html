.range{width:100%;accent-color:var(--cta);padding:0}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {

        }

        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';

<div class="card qrcard"><div class="eyebrow">${on?'Sesión activa':'Esperando al anfitrión'}</div>${on?`<div class="qrwrap"><div id="qr"></div><i class="ring"></i></div><h3>Escanea para empezar</h3><p class="small muted" style="text-align:center">Apunta la cámara de tu celular al código. Tarda 5 minutos.</p><button class="btn" data-act="start">Empezar en este dispositivo</button>`:`<div class="qrwrap off"><span>QR</span></div><h3>El QR aparecerá aquí</h3><p class="small muted" style="text-align:center">El código se muestra solo mientras el anfitrión tiene la sesión activa.</p>`}</div></section>
<section class="steps">${[['1','Tu empresa','Escribe su nombre y la investigamos para ti.'],['2','Tu rol','Adaptamos las preguntas a lo que ves en tu día a día.'],['3','8 preguntas','Rápidas, sin respuestas correctas o incorrectas.'],['4','Tu diagnóstico','Madurez, riesgos y recomendaciones al instante.']].map(x=>`<div class="step"><b>${x[0]}</b><span><b>${x[1]}</b><span class="small muted">${x[2]}</span></span></div>`).join('')}</section>
${S.owner?vOwn():''}</div>`}
function vOwn(){const on=CFG.active&&Date.now()<CFG.until;
 return `<section class="card own"><div class="eyebrow">Panel del anfitrión · solo tú ves esto</div><h3>Sesión: ${on?'<span style="color:var(--ok)">Activa hasta las '+new Date(CFG.until).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})+'</span>':'Inactiva'}</h3>
${on?`<button class="btn" style="background:#B3261E;color:#fff" data-act="deact" ${S.busy?'disabled':''}>Desactivar y apagar el QR</button>`:`<label>Enlace público de esta página (Compartir → cualquiera con el enlace)<input id="oPub" value="${esc(S.pub)}"></label>
<label>Duración<select id="oDur"><option value="1">1 hora</option><option value="2">2 horas</option><option value="3" selected>3 horas</option><option value="6">6 horas</option></select></label>
<button class="btn" data-act="activate" ${S.busy?'disabled':''}>${S.busy?'<span class="spin"></span>Activando…':'Activar sesión y mostrar QR'}</button>`}
${S.err?`<p class="err">${esc(S.err)}</p>`:''}
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" data-act="prev">Probar como participante</button>${CFG.panelUrl?`<a class="btn ghost sm" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="${esc(CFG.panelUrl)}">Abrir tablero en vivo y envíos</a>`:''}</div>
<p class="small muted">Con la sesión inactiva, el QR desaparece y ningún enlace permite entrar al diagnóstico.</p></section>`}

const STEPS=['Consultando el sitio web oficial…','Revisando registros y directorios empresariales…','Buscando noticias y perfiles públicos…','Cruzando fuentes y armando el perfil…'];
function vCo(){const c=S.co;
 if(c.step==='ask')return `<div class="screen"><div class="eyebrow">Paso 1 · Tu empresa</div><h2>¿Cómo se llama tu empresa?</h2><p class="muted small">Nuestra IA la investiga en internet y fuentes públicas para que las preguntas hablen de tu negocio.</p>
<label>Nombre de la empresa<input id="coIn" value="${esc(c.q)}" placeholder="Ej.: Leonisa" autocomplete="organization"></label>${S.err?`<p class="err">${esc(S.err)}</p>`:''}<button class="btn" data-act="search">Investigar mi empresa</button></div>`;
 if(c.step==='searching')return `<div class="screen"><div class="eyebrow">Investigando</div><h2>${esc(c.q)}</h2><div class="card scan"><div class="scanbar"><i></i></div><ul class="stp">${STEPS.map((s,i)=>`<li style="animation-delay:${i*0.55}s">${s}</li>`).join('')}</ul></div></div>`;
 if(c.step==='manual')return `<div class="screen"><div class="eyebrow">Paso 1 · Tu empresa</div><h2>Cuéntanos de ${esc(c.q)}</h2><p class="muted small">No encontramos información verificada. Dinos lo básico y adaptamos las preguntas.</p>
<label>Sector<select id="mSec">${Object.keys(SEC).map(k=>`<option value="${k}" ${c.man.sector===k?'selected':''}>${SEC[k].lab}</option>`).join('')}</select></label>
<label>¿A qué se dedica? (una frase)<textarea id="mAct" rows="2" placeholder="Ej.: fabricamos y vendemos…">${esc(c.man.act)}</textarea></label>
<label>Número aproximado de empleados<input id="mEmp" inputmode="numeric" value="${esc(c.man.emp)}"></label><button class="btn" data-act="manualGo">Continuar</button></div>`;
 const f=c.found,e=c.est,d=e||f;
 return `<div class="screen"><div class="eyebrow">Esto encontramos</div><h2>${esc(d.n)}</h2>
<div class="card prof"><div class="badge ${(e&&e.ai)||(f&&!f.pend)?'ok':'est'}">${e&&e.ai?'Investigado con IA en fuentes públicas':f&&!f.pend?'Perfil investigado por Softgic':'Estimado por IA · valida si es correcto'}</div>
<div class="kv"><span class="k">Qué hace</span><span>${esc(d.res||d.act)}</span></div>
<div class="kv"><span class="k">Sector</span><span>${esc(d.sector)}</span></div>
<div class="kv"><span class="k">Empleados</span><span>${esc(d.emp||'Sin dato público')}</span></div>
<div class="kv"><span class="k">Presencia</span><span>${esc(d.pres||'Sin dato público')}</span></div>
${d.web?`<div class="kv"><span class="k">Sitio web</span><span>${esc(d.web)}</span></div>`:''}
<div class="small muted">Fuentes: ${esc(d.src||'conocimiento general de la IA')}</div></div>
<p class="small">¿Es tu empresa y la información es correcta?</p>
<button class="btn" data-act="coOk">Sí, continuar</button><button class="btn ghost" data-act="coNo">No, corregir datos</button></div>`}
function vRol(){return `<div class="screen"><div class="eyebrow">Paso 2 · Tu rol</div><h2>¿Desde qué rol respondes?</h2><p class="muted small">Con esto adaptamos las preguntas a lo que ves en tu día a día en ${esc(CO())}.</p>
<div class="opts">${ROLES.map(r=>`<button class="opt ${S.role===r.id?'sel':''}" data-act="role" data-id="${r.id}"><span class="dot"></span><span>${r.lab}</span></button>`).join('')}</div>
${S.role?`<div class="flat"><div class="eyebrow">Lo que entendemos de tu rol</div><div class="chips" style="margin-top:8px"><span class="chip">Decisión: ${esc(R().dec)}</span><span class="chip">${esc(R().cap)}</span></div></div><button class="btn" data-act="go" data-to="q" data-q="0">Empezar las 8 preguntas</button>`:''}</div>`}
function vQ(){const i=S.q,sel=S.ans[i],ej=qEj(i);return `<div class="screen"><div class="eyebrow">Pregunta ${i+1} de 8 · ${DIMS[QS[i].dim]}</div><h2>${esc(qText(i))}</h2><p class="muted small">${HINTS[i]}${ej?' Por ejemplo, en '+esc(CO())+': '+esc(ej)+'.':''}</p>
<div class="opts">${qOpts(i).map((o,k)=>`<button class="opt ${sel===k?'sel':''}" data-act="ans" data-k="${k}"><span class="dot"></span><span>${esc(o)}</span></button>`).join('')}</div>${qNav(sel!=null,false)}</div>`}
function vPrio(){const pr=S.pack.procs[S.role]||[];return `<div class="screen"><div class="eyebrow">Último bloque · Tu prioridad</div><h2>De estos procesos de ${esc(CO())}, ¿cuál te gustaría resolver primero?</h2><p class="muted small">Elige el que más tiempo te quita o más te frena hoy.</p>

${S.p9?`<h3>Entre todas las personas, ¿cuánto tiempo consume «${esc(S.p9)}» cada semana?</h3><div class="opts">${HRS.map((o,k)=>`<button class="opt ${S.hrs===k?'sel':''}" data-act="hrs" data-k="${k}"><span class="dot"></span><span>${o.l}</span></button>`).join('')}</div>
<h3>¿Quién decide invertir en resolverlo?</h3><div class="chips">${['Yo','Mi jefe','Un comité','No lo sé'].map(d=>`<button class="opt" style="width:auto;padding:10px 16px;${S.dm===d?'border-color:var(--brand);background:var(--soft)':''}" data-act="dm" data-v="${d}">${d}</button>`).join('')}</div>`:''}
${qNav(S.p9!=null&&S.hrs!=null&&S.dm!=null,true)}</div>`}
function qNav(ok,last){return `<div style="display:flex;gap:10px"><button class="btn ghost sm" data-act="back">Atrás</button><button class="btn" data-act="next" ${ok?'':'disabled'}>${last?'Ver mi diagnóstico':'Siguiente'}</button></div>`}
function ladder(o){return `<div class="lad">${LEVELS.map((l,i)=>`<div class="${i+1===Math.round(o)?'cur':i+1<Math.round(o)?'done':''}"><b>${i+1}</b><span>${l}</span></div>`).join('')}</div>`}
function dimCards(sc){return `<div class="dims">${DIMS.map((d,i)=>{const v=sc[i],inf=DIMINFO[d];return `<div class="dim"><div class="dh"><b>${d}</b><span class="lv">Nivel ${Math.round(v)} · ${lvl(v)}</span></div><div class="bar"><i style="width:${v/5*100}%"></i></div><p class="small muted">${inf.q}</p><p class="small"><b>${dimWord(v)}.</b> ${inf.r[bandIdx(v)]}</p></div>`}).join('')}</div>`}
function vDx(){const sc=scores(),o=overall(),sh=shadow();
 return `<div class="screen"><div class="eyebrow">Tu diagnóstico</div>
<div class="card"><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="big" id="bigN" data-v="${o.toFixed(1)}">0.0</div><div><h2>Nivel ${Math.round(o)} · ${lvl(o)}</h2><p class="muted small">${esc(CO())} · ${esc(SE().lab)}</p></div></div>${ladder(o)}
<div class="chips"><span class="chip ${sh==='Alto'?'o':''}">Índice de Shadow AI: ${sh}</span><span class="chip">Perfil: ${esc(R().lab.split(' / ')[0])}</span></div></div>
<div class="card"><h3>Mapa de madurez</h3>${radar(sc)}${heat(sc)}</div>
<div class="card"><h3>Las 5 aristas, en breve</h3>${dimCards(sc)}</div>
${risk()}
<div class="card"><h3>Recomendaciones para empezar</h3><div class="opts">${recos(sc).map((t,i)=>`<div class="opp"><b>${i+1}. ${esc(t[0])}</b><span class="small">${esc(t[1])}</span></div>`).join('')}</div></div>
<div class="card"><h3>Oportunidades para tu rol</h3><div class="opts">${oppsRole().map(t=>`<div class="opp">${esc(t)}</div>`).join('')}</div></div>
${sliders()}
<div class="flat"><h3>El siguiente paso</h3><p class="small" style="margin-top:6px">Este diagnóstico es una primera foto. Recibe el informe completo en tu correo y, si quieres, agenda una sesión con Softgic para revisarlo con tu equipo.</p></div>
<button class="btn" data-act="go" data-to="cap">Quiero mi informe completo</button></div>`}
function recos(sc){const w=DIMS.map((d,i)=>[d,sc[i]]).sort((a,b)=>a[1]-b[1]);const out=w.slice(0,2).map(x=>[x[0]+': '+dimWord(x[1]).toLowerCase(),DIMINFO[x[0]].r[bandIdx(x[1])]]);
 out.push(['Prioriza «'+S.p9+'»','Documenta el proceso, define su indicador de éxito y prueba un piloto de IA con revisión humana.']);return out}
function vCap(){const L=S.lead;
 if(S.sent)return `<div class="screen" style="text-align:center"><div style="display:grid;place-items:center">${robot()}</div><h2>¡Listo, ${esc((L.nombre||'').trim().split(' ')[0])}!</h2><p class="muted">En unos segundos llegará tu diagnóstico completo a <b>${esc(L.email.trim())}</b>. Si no lo ves, revisa la carpeta de correo no deseado.</p><button class="btn" data-act="go" data-to="rep">Ver mi informe en pantalla</button></div>`;
 if(S.sendStage)return `<div class="screen"><div class="eyebrow">Último clic</div><h2>Confirma y recibe tu informe</h2><p class="muted small">Enviaremos el diagnóstico de ${esc(CO())} a <b>${esc(L.email.trim())}</b>. Marca la autorización y pulsa el botón.</p>
<div class="card" style="padding:6px;overflow:hidden"><iframe id="tallyFrame" title="Confirmar envío del informe" src="${esc(tallyUrl().replace('https://tally.so/r/','https://tally.so/embed/')+'&hideTitle=1&transparentBackground=1&alignLeft=1')}" width="100%" height="330" frameborder="0" style="border:0;display:block;background:transparent"></iframe></div>
<a class="small" target="_blank" rel="noopener" href="${esc(tallyUrl())}">¿No se muestra? Ábrelo en una pestaña nueva</a>
<button class="btn ghost" data-act="sendBack">Corregir mis datos</button></div>`;
 return `<div class="screen"><div class="eyebrow">Último paso</div><h2>Recibe tu diagnóstico completo en tu correo</h2>
<p class="muted small">Incluye situación actual, objetivo, solución, arquitectura de referencia, retorno estimado y oportunidades para ${esc(CO())}.</p>
<div class="card"><label>Nombre completo<input id="lNombre" value="${esc(L.nombre)}" autocomplete="name"></label>
<label>Correo electrónico<input id="lEmail" type="email" value="${esc(L.email)}" autocomplete="email"></label></div>
<div class="card"><h3>¿Quieres ir más allá? <span class="small muted">(opcional)</span></h3>
<button class="opt ${L.ses?'sel':''}" data-act="tog" data-k="ses"><span class="dot"></span><span><b>Sesión personalizada</b><br><span class="small muted">Revisar con mi equipo las necesidades de IA de mi empresa.</span></span></button>
<button class="opt ${L.ent?'sel':''}" data-act="tog" data-k="ent"><span class="dot"></span><span><b>Entrenamiento en habilidades de IA</b><br><span class="small muted">Para uno de mis equipos.</span></span></button></div>
<button id="sendA" class="btn" data-act="sendGo" ${capOk()?'':'data-off="1" style="opacity:.5"'}>Enviarme el diagnóstico</button>
<p id="capMsg" class="err" style="display:none">Escribe tu nombre completo y un correo válido.</p>
<button class="btn ghost" data-act="go" data-to="rep">Ver mi informe en pantalla</button></div>`}
function capOk(){const L=S.lead;return L.nombre.trim().length>2&&/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(L.email.trim())}
function tallyUrl(){const o=overall(),L=S.lead;const q=new URLSearchParams({sid:CFG.sid||'',empresa:CO(),sector:SE().lab,actividad:(S.pack.actividad||'').slice(0,180),rol:S.role,resp:S.ans.join(''),proceso:S.p9||'',horas:String(S.hours),costo:String(S.cost),decide:S.dm||'',nivel:o.toFixed(1),nombre:L.nombre.trim(),email:L.email.trim(),cargo:'',celular:'',sesion:L.ses?'si':'no',entrenamiento:L.ent?'si':'no',conf:S.pack.conf||''});return TALLY+'?'+q.toString()}
function vRep(){const sc=scores(),o=overall(),s=savings(),se=SE(),lv=lvl(o),weak=DIMS.map((d,i)=>[d,sc[i]]).sort((a,b)=>a[1]-b[1]).slice(0,2).map(x=>x[0]);
 const sec=(n,t,b)=>`<div class="card"><div class="sec"><span class="num">${n}</span><h2>${t}</h2></div>${b}</div>`;
 return `<div class="screen" id="report"><div class="eyebrow">Informe Discovery Express</div><h1>${esc(CO())}</h1>
<p class="muted small">Nivel ${Math.round(o)} · ${lv} · ${esc(se.lab)}${band(S.pack.emp)?' · '+band(S.pack.emp):''}</p>
<div class="flat"><p class="small">¿Quieres recibirlo en tu correo?</p><button class="btn sm" style="margin-top:8px" data-act="go" data-to="cap">Enviarme el informe</button></div>
${sec(1,'Situación actual',`<p>Tu empresa está en nivel <b>${Math.round(o)} (${lv})</b>. Las dimensiones más débiles son <b>${weak.join(' y ')}</b>. Índice de Shadow AI: <b>${shadow()}</b>.</p>${radar(sc)}${heat(sc)}<p class="small">«${esc(S.p9)}» consume cerca de ${fmt(S.hours)} h/semana.</p>`)}
${sec(2,'Objetivo',`<p>Llevar a ${esc(CO())} al <b>nivel ${Math.min(5,Math.round(o)+1)} (${LEVELS[Math.min(4,Math.round(o))]})</b> en 6 a 9 meses, empezando por «${esc(S.p9)}», con IA gobernada y retorno medido por rol.</p>`)}
${sec(3,'Solución',`<div class="opts">${[['Ordenar','Documentar el proceso prioritario y sus datos.'],['Gobernar','Política de IA, herramientas aprobadas y capacitación por rol.'],['Piloto','Un agente de IA sobre «'+S.p9+'», con revisión humana.'],['Escalar','Medir retorno y replicar a otros procesos.']].map((x,i)=>`<div class="opp"><b>${i+1}. ${x[0]}</b><span class="small">${esc(x[1])}</span></div>`).join('')}</div>`)}
${sec(4,'Arquitectura de referencia',arch()+`<p class="small">Se adapta a tu stack actual; no exige reemplazar tus sistemas.</p>`)}
${sec(5,'Retorno estimado y % de mejora',`<div class="kpis"><div class="kpi o"><b>${fmt(s.hlo)}–${fmt(s.hhi)} h</b><span>Horas recuperables al año</span></div><div class="kpi o"><b>${cop(s.lo)}–${cop(s.hi)}</b><span>Valor anual estimado</span></div><div class="kpi"><b>25–40%</b><span>Tiempo recuperable (hipótesis)</span></div></div>
<p class="small muted">Supuestos: ${fmt(S.hours)} h/semana, 48 semanas, costo hora de $${fmt(S.cost)} COP. Hipótesis de trabajo para validar en el Discovery profundo; no es una promesa de resultado.</p>`)}
${sec(6,'Oportunidades en '+esc(se.lab),se.opps.map(x=>`<div class="opp"><h3>${esc(x[0])}</h3><p class="small"><b>Cómo abordarla:</b> ${esc(x[1])}</p><div class="arch" style="font-size:12px"><span style="flex-basis:100%;text-align:left">${esc(x[2])}</span></div><div class="pct">Mejora de referencia: ${esc(x[3])} (hipótesis a validar)</div></div>`).join(''))}
${sec(7,'Oportunidades por rol',ROLES.map(r=>`<div class="opp"><h3>${esc(r.lab)}</h3><ul class="small" style="margin:0;padding-left:18px">${((S.pack.roleOpps&&S.pack.roleOpps[r.id])||r.opps).map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p class="small muted">Se mide en: ${esc(r.kpi)}</p></div>`).join(''))}
${sec(8,'Cómo te acompaña Softgic',`<div class="ladder">${['Discovery profundo','Diagnóstico por proceso y rol','Arquitectura de referencia a tu medida','Adopción y educación del equipo'].map((t,i)=>`<div><b>${i+1}</b>${t}</div>`).join('')}</div><p class="small">Siguiente paso: una sesión de trabajo con tu equipo para convertir este informe en un piloto con retorno medido.</p>`)}
<div style="display:flex;gap:10px;flex-wrap:wrap">${S.cap.dl?'<button class="btn ghost sm" data-act="dl">Descargar informe</button>':''}<button class="btn ghost sm" data-act="copy">Copiar resumen</button></div></div>`}
function lectura(){const sc=scores(),w=DIMS.map((d,i)=>[d,sc[i]]).sort((a,b)=>a[1]-b[1])[0][0].toLowerCase();
 return{l:`${CO()} está en nivel ${Math.round(overall())} (${lvl(overall())}). Lo más urgente es fortalecer ${w} antes de escalar IA. Con este nivel, usar IA sin reglas aumenta el riesgo de información dispersa y de herramientas fuera de control.`,p:`Documentar «${S.p9}» y definir una política corta de uso de IA con herramientas aprobadas.`}}
function vClosed(){return `<div class="screen" style="text-align:center;padding-block:40px"><div style="display:grid;place-items:center">${robot()}</div><h2>Esta sesión no está activa</h2><p class="muted">El diagnóstico se abre únicamente durante el brunch. Pide a tu anfitrión de Softgic que active la sesión y escanea el código.</p></div>`}
function render(){const A=$('#app');let h;document.body.classList.toggle('wide',S.mode==='home');
 if(S.mode==='closed')h=topBar()+vClosed();
 else if(S.mode==='home')h=topBar()+vHome();
 else{h=topBar()+(S.preview?'<div class="flat small" style="margin-bottom:14px">Vista previa del participante. <button class="btn ghost sm" data-act="exitPrev" style="margin-left:8px">Volver al inicio</button></div>':'');
  const v={co:vCo,role:vRol,q:vQ,prio:vPrio,dx:vDx,cap:vCap,rep:vRep}[S.scr]||vCo;h+=v()}
 A.classList.toggle('still',!!S._keep);A.innerHTML=h;if(!S._keep)window.scrollTo(0,0);S._keep=false;afterRender()}
function afterRender(){
 if(S.mode==='home'&&CFG.active&&Date.now()<CFG.until&&window.qrcode){const el=document.getElementById('qr');if(el){try{const U=(CFG.web?location.href.split('#')[0]:(CFG.publicUrl||S.pub).replace(/#.*$/,''))+'#'+CODE;const q=qrcode(0,'M');q.addData(U);q.make();const n=q.getModuleCount(),c=6,sz=n*c;let d='';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))d+='M'+(k*c)+','+(r*c)+'h'+c+'v'+c+'h-'+c+'z';const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+sz+' '+sz+'" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#ffffff"/><path d="'+d+'" fill="#000000"/></svg>';el.innerHTML='<img id="qrimg" alt="Código QR para abrir el Discovery Express" width="210" height="210" style="display:block;width:210px;height:210px;background:#fff" src="data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)+'"><div style="font-size:11px;color:#444;word-break:break-all;max-width:210px;margin-top:6px">'+U.replace(/^https?:\/\//,'')+'</div>'}catch(e){el.textContent='QR no disponible: '+(e&&e.message)}}}
 const b=document.getElementById('bigN');if(b){const v=+b.dataset.v;let t0=null;const step=ts=>{if(t0==null)t0=ts;const p=Math.min(1,(ts-t0)/900);b.textContent=(v*(1-Math.pow(1-p,3))).toFixed(1);if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
 if(S.scr==='co'&&S.co.step==='searching'){clearTimeout(S._st);S._st=setTimeout(finishSearch,2400)}}
function go(to){S.scr=to;S.err='';render()}
function stash(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}
function reportText(){const o=overall(),s=savings();return `Discovery Express Softgic — ${CO()}\nNivel ${Math.round(o)} (${lvl(o)}) · ${SE().lab}\nProceso prioritario: ${S.p9} (~${S.hours} h/semana)\nValor anual estimado: ${cop(s.lo)} a ${cop(s.hi)} (hipótesis, 25–40%)\nShadow AI: ${shadow()}`}
function buildPack(d,sk,conf){const base=SEC[sk]||SEC.otr;const core=(d.procs&&d.procs.length>=6)?d.procs:base.procs;const procs={};
 ROLES.forEach(r=>{procs[r.id]=r.id==='ti'?core.slice(0,4).concat(['Soporte a usuarios y sistemas','Seguridad de accesos y datos']):core.slice()});
 return{empresa:d.n,sector:d.sector||base.lab,sk,actividad:d.res||d.act||'',emp:d.emp||'',pres:d.pres||'',conf,procs,ej:d.ej||{},opps:(d.opps&&d.opps.length)?d.opps:base.opps}}
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}};
function legacyFinish(c){
 if(c.found&&!c.found.pend){c.step='result';return render()}
 if(c.found&&c.found.pend){c.man.sector='otr';c.step='manual';return render()}
 c.step='manual';render()}
function finishSearch(){const c=S.co;if(c.step!=='searching')return;c.timerDone=true;
 const W=(window.DX_CONFIG||{}).worker;
 if(W&&!c.aiDone)return;
 const j=c.ai;
 if(j&&j.encontrada&&j.actividad){const sk=SEC[j.categoria]?j.categoria:secKey((j.sector||'')+' '+j.actividad);
  const src=(j.fuentes||[]).map(hostOf).filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).slice(0,4).join(' · ');
  c.est={n:j.nombre||c.q,sector:j.sector||SEC[sk].lab,sk,res:j.actividad,emp:j.empleados||'',pres:j.presencia||'',web:j.web||'',src:src||'búsqueda en internet con IA',ai:true};c.step='result';return render()}
 legacyFinish(c)}
function search(){const v=(document.getElementById('coIn').value||'').trim();S.co.q=v;if(v.length<2){S.err='Escribe el nombre de tu empresa.';return render()}
 S.err='';const c=S.co;c.found=findCompany(v);c.est=null;c.ai=null;c.aiDone=false;c.aiErr='';c.timerDone=false;c.step='searching';
 const W=(window.DX_CONFIG||{}).worker;
 if(W){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),55000);
  fetch(W,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({empresa:v}),signal:ctl.signal}).then(r=>r.ok?r.json():Promise.reject(new Error('http '+r.status))).then(j=>{c.ai=j}).catch(e=>{c.ai=null;c.aiErr=String(e&&e.message||e)}).finally(()=>{clearTimeout(to);c.aiDone=true;if(S.co===c&&c.step==='searching'&&c.timerDone)finishSearch()})}
 render()}
function coOk(){const c=S.co,known=c.found&&!c.found.pend?c.found:null;let d,conf;if(c.est){d=Object.assign({},known||{},c.est);if(known)d.sk=known.sk;conf=c.est.ai?'ia-web':'estimada'}else{d=known;conf='verificada'}S.pack=buildPack(d,d.sk,conf);S.role=null;S.ans=[];S.q=0;go('role')}
function manualGo(){const c=S.co;c.man.sector=document.getElementById('mSec').value;c.man.act=document.getElementById('mAct').value.trim();c.man.emp=document.getElementById('mEmp').value.trim();
 if(c.man.act.length<5){S.err='Cuéntanos en una frase a qué se dedica.';return render()}
 const sk=c.man.sector,d={n:c.q,sector:SEC[sk].lab,sk,res:c.man.act,emp:c.man.emp?c.man.emp+' empleados (informado por ti)':'',pres:'',src:'datos informados por el participante'};S.pack=buildPack(d,sk,'manual');S.role=null;S.ans=[];S.q=0;go('role')}
function rand(n){const a='abcdefghjkmnpqrstuvwxyz23456789';let r='';const b=new Uint32Array(n);(crypto||window.crypto).getRandomValues(b);for(const x of b)r+=a[x%a.length];return r}
async function buildAndPublish(cfg){
 const parts=[];for(const el of document.body.children){const t=el.tagName;
  if(t==='TITLE'||t==='LINK'||t==='STYLE')parts.push(el.outerHTML);
  else if(t==='SCRIPT'&&el.id==='cfg')parts.push('<script type="application/json" id="cfg">'+JSON.stringify(cfg).replace(/</g,'\\u003c')+'<\/script>');
  else if(t==='SCRIPT')parts.push(el.outerHTML);
  else if(el.id==='wrap')parts.push('<div id="wrap"><div id="app"></div></div>')}
 const html='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#fafaf9}img{max-width:100%}[hidden]{display:none!important}</style></head><body>'+parts.join('')+'</body></html>';
 return S.cap.art.publish(html)}
function readOwner(){const pu=document.getElementById('oPub');if(pu)S.pub=pu.value.trim();const d=document.getElementById('oDur');if(d)S.dur=+d.value}
async function activate(){readOwner();
 if(!S.cap.art){S.err='La publicación no está disponible en esta vista.';return render()}
 if(!/^https?:\/\//.test(S.pub)){S.err='Pega el enlace público de esta página.';return render()}
 S.busy=true;S.err='';render();
 const sid='S'+Date.now().toString(36);try{localStorage.setItem('dx_pub',S.pub)}catch(e){}
 const cfg={active:true,h:hash5(CODE),sid,until:Date.now()+S.dur*3600e3,publicUrl:S.pub,panelUrl:CFG.panelUrl||''};
 try{await buildAndPublish(cfg)}catch(e){S.busy=false;S.err=(e&&e.code==='conflict')?'Hubo un cambio simultáneo; intenta de nuevo.':'No se pudo activar ('+((e&&e.code)||'error')+').';render()}}
async function deact(){S.busy=true;render();
 try{await buildAndPublish({active:false,publicUrl:CFG.publicUrl||S.pub,panelUrl:CFG.panelUrl||''})}catch(e){S.busy=false;S.err='No se pudo desactivar. Intenta de nuevo.';render()}}
document.addEventListener('click',async ev=>{const t=ev.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
 if(a==='theme'){const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark';return}
 if(a==='activate')return activate();
 if(a==='deact')return deact();
 if(a==='start'){location.hash=CODE;return decide()}
 if(a==='prev'){S.preview=true;S.mode='part';S.scr='co';S.co={q:'',step:'ask',found:null,est:null,man:{sector:'otr',act:'',emp:''}};return render()}
 if(a==='exitPrev'){S.preview=false;S.mode='home';return render()}
 if(a==='search')return search();
 if(a==='coOk')return coOk();
 if(a==='coNo'){S.co.step=S.co.found&&!S.co.found.pend?'ask':'manual';S.co.found=null;S.co.est=null;if(S.co.step==='manual')S.co.step='manual';return render()}
 if(a==='manualGo')return manualGo();
 if(a==='go'){if(t.dataset.q!=null)S.q=+t.dataset.q;return go(t.dataset.to)}
 if(a==='role'){S.role=t.dataset.id;S.ans=[];S.q=0;S.p9=null;S.hrs=null;S.dm=null;return render()}
 if(a==='ans'){S.ans[S.q]=+t.dataset.k;S._keep=true;return render()}
 if(a==='p9'){S.p9=t.dataset.v;S._keep=true;return render()}
 if(a==='hrs'){S.hrs=+t.dataset.k;S.hours=HRS[S.hrs].v;S._keep=true;return render()}
 if(a==='dm'){S.dm=t.dataset.v;S._keep=true;return render()}
 if(a==='sendGo'){readLead();if(!capOk()){const m=document.getElementById('capMsg');if(m)m.style.display='block';return}S.sendStage=true;return render()}
 if(a==='sendBack'){S.sendStage=false;return render()}
 if(a==='tog'){S.lead[t.dataset.k]=!S.lead[t.dataset.k];readLead();S._keep=true;return render()}
 if(a==='back'){if(S.scr==='prio'){S.scr='q';S.q=7;return render()}if(S.q>0){S.q--;render()}else go('role');return}
 if(a==='next'){if(S.scr==='q'){if(S.q<7){S.q++;render()}else go('prio')}else go('dx');return}
 if(a==='copy'){try{await navigator.clipboard.writeText(reportText());t.textContent='Copiado'}catch(e){t.textContent='Selecciona y copia desde pantalla'}return}
 if(a==='dl'){const css=document.querySelector('style').textContent;const html='<!doctype html><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><title>Informe Discovery Express</title><style>'+css+'</style><body><div id="wrap">'+document.getElementById('report').outerHTML.replace(/<button[\s\S]*?<\/button>/g,'')+'</div>';
  try{await S.cap.dl.save({filename:'Informe-Discovery-Express-'+CO().replace(/\W+/g,'-')+'.html',data:html})}catch(e){}return}});
function readLead(){const g=id=>{const e=document.getElementById(id);return e?e.value:null};const L=S.lead;
 if(g('lNombre')!=null){L.nombre=g('lNombre');L.email=g('lEmail')}}
document.addEventListener('input',ev=>{const t=ev.target;
 if(t.dataset&&t.dataset.act==='hrsR'){S.hours=+t.value;const l=t.parentElement.querySelector('b');if(l)l.textContent=fmt(S.hours);upd()}
 if(t.id==='costIn'){S.cost=Math.max(0,+t.value.replace(/\D/g,'')||0);upd()}
 if(/^l(Nombre|Email)$/.test(t.id)){readLead();const a=document.getElementById('sendA');if(a){if(capOk()){a.removeAttribute('data-off');a.style.opacity=''}else{a.dataset.off='1';a.style.opacity='.5'}}}});
function upd(){const k=document.querySelectorAll('.kpis .kpi.o b');if(k.length>=2&&S.scr==='dx'){k[0].textContent=cop(savings().lo);k[1].textContent=cop(savings().hi)}
 const wb=document.querySelector('.warnbox');if(wb&&S.scr==='dx'){const n=document.createElement('div');n.innerHTML=risk();wb.replaceWith(n.firstChild)}}
function decide(){const h=(location.hash||'').replace(/^#/,'');
 if(S.preview){S.mode='part';return render()}
 if(h){if(sessionOpen()){if(S.mode!=='part'){S.mode='part';S.scr='co'}}else S.mode='closed'}else S.mode='home';render()}
window.addEventListener('hashchange',()=>{if(!S.preview)decide()});
setInterval(()=>{if(S.mode==='part'&&!S.preview&&!sessionOpen()){S.mode='closed';render()}},30000);
decide();
(async()=>{try{const[sample,dl,user,art]=await Promise.all([claude.use('sample'),claude.use('downloads'),claude.use('user'),claude.use('artifact')]);
 S.cap.sample=sample;S.cap.dl=dl;S.cap.user=user;S.cap.art=art;S.owner=!!(user&&user.isOwner&&user.isOwner());
 if(S.owner){try{S.pub=CFG.publicUrl||localStorage.getItem('dx_pub')||DEFPUB}catch(e){}}
 if(S.mode==='home')render()}catch(e){window._capErr=String(e)}})();

 const t=typeof d==='string'?d:(d&&d.event)||'';if(/Tally\.FormSubmitted/.test(t)){S.sent=true;S.sendStage=false;render()}});
